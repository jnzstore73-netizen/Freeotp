<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NokosFree – Nomor Virtual untuk OTP</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14192b;--mu:#69718a;--bd:#e4e8f2;--ac:#4f46e5;--ac2:#7c3aed;--ok:#16a34a;--wr:#d97706;--er:#dc2626;--sel:#eef0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--card:#171b30;--tx:#eef0fa;--mu:#98a0bd;--bd:#262c48;--sel:#232a55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1020;--card:#171b30;--tx:#eef0fa;--mu:#98a0bd;--bd:#262c48;--sel:#232a55;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:13px;margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 6px;cursor:pointer;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s}
.opt span{font-size:22px}
.opt:hover{border-color:var(--ac)}
.opt.on{border-color:var(--ac);background:var(--sel);font-weight:600}
select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--er);border:1.5px solid var(--bd);margin-top:10px}
.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.num{font-size:24px;font-weight:800;letter-spacing:.02em;word-break:break-all}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.b-wait{background:#fef3c7;color:#92400e}.b-ok{background:#dcfce7;color:#166534}.b-no{background:#fee2e2;color:#991b1b}
.otp{margin-top:12px;padding:14px;border-radius:12px;background:var(--sel);text-align:center;animation:pop .35s ease}
.otp b{display:block;font-size:34px;letter-spacing:.25em;margin:4px 0 8px}
.msg{font-size:13px;color:var(--mu)}
.wait{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--mu);font-size:14px}
.spin{width:18px;height:18px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
.hist{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd);font-size:14px}
.hist:first-of-type{border-top:0}
.empty{color:var(--mu);font-size:14px;text-align:center;padding:8px}
.note{font-size:12px;color:var(--mu);background:var(--card);border:1px dashed var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.icon{background:var(--card);border:1px solid var(--bd);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:17px;color:var(--tx)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#14192b;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="logo">NokosFree</div><p class="sub">Nomor virtual gratis untuk terima OTP</p></div>
    <button class="icon" id="theme" aria-label="Ganti tema">🌓</button>
  </header>

  <div class="card" id="orderCard">
    <h2>1. Pilih layanan</h2>
    <div class="grid" id="services"></div>
    <h2 style="margin-top:16px">2. Pilih negara</h2>
    <select id="country"></select>
    <button class="btn" id="get" style="margin-top:16px">Ambil Nomor</button>
  </div>

  <div class="card hide" id="active">
    <div class="row"><h2 id="aTitle" style="margin:0"></h2><span class="badge b-wait" id="aBadge">Menunggu SMS</span></div>
    <div class="row" style="margin-top:10px">
      <div class="num" id="aNum"></div>
      <button class="btn sm" id="copyNum" style="width:auto">Salin</button>
    </div>
    <div class="msg" id="aTimer" style="margin-top:4px"></div>
    <div class="wait" id="aWait"><div class="spin"></div>Menunggu kode OTP masuk…</div>
    <div class="otp hide" id="aOtp">
      <div class="msg">Kode OTP Anda</div><b id="aCode"></b>
      <button class="btn sm" id="copyOtp">Salin Kode</button>
      <div class="msg" id="aMsg" style="margin-top:8px"></div>
    </div>
    <button class="btn ghost" id="cancel">Batalkan</button>
    <button class="btn hide" id="again" style="margin-top:10px">Pesan Lagi</button>
  </div>

  <div class="card">
    <div class="row"><h2 style="margin:0">Riwayat</h2><button class="icon" id="clear" style="width:auto;padding:0 10px;font-size:13px">Hapus</button></div>
    <div id="hist" style="margin-top:8px"></div>
  </div>

  <p class="msg" style="text-align:center">Gunakan layanan ini secara bertanggung jawab dan sesuai aturan platform tujuan.</p>
</div>
<div id="toast"></div>

<script>
(function(){
var SERVICES=[{id:'wa',n:'WhatsApp',i:'💬'},{id:'tg',n:'Telegram',i:'✈️'},{id:'ig',n:'Instagram',i:'📸'},{id:'fb',n:'Facebook',i:'👍'},{id:'tt',n:'TikTok',i:'🎵'},{id:'gg',n:'Google',i:'🔎'}];
var COUNTRIES=[{c:'ID',n:'Indonesia',p:'+62 8',l:10},{c:'MY',n:'Malaysia',p:'+60 1',l:9},{c:'US',n:'Amerika Serikat',p:'+1 ',l:10},{c:'GB',n:'Inggris',p:'+44 7',l:9},{c:'IN',n:'India',p:'+91 9',l:9}];
var TTL=15*60;
var sel=SERVICES[0].id, order=null, tick=null, otpTimer=null, hist=[];
function $(id){return document.getElementById(id)}
function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show')},1800)}
function copy(text){
  function fb(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);toast(ok?'Tersalin':'Gagal menyalin')}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('Tersalin')},fb)}else{fb()}
}
function svc(id){return SERVICES.filter(function(s){return s.id===id})[0]}
function rnd(n){var s='';for(var i=0;i<n;i++){s+=Math.floor(Math.random()*10)}return s}
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}

function requestNumber(country){
  return fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:sel,country:country.c})})
  .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Gagal memesan nomor');return d})});
}
function pollOtp(o){
  return new Promise(function(res){
    function go(){
      if(order!==o||o.status!=='wait'){return res(null)}
      fetch('/api/order/'+o.pid).then(function(r){return r.json()}).then(function(d){
        if(d.code){return res({code:d.code})}
        if(d.status==='CANCELED'||d.status==='TIMEOUT'||d.status==='BANNED'){setStatus('expired');return res(null)}
        otpTimer=setTimeout(go,4000);
      }).catch(function(){otpTimer=setTimeout(go,6000)});
    }
    otpTimer=setTimeout(go,4000);
  });
}

function renderServices(){
  var h='';SERVICES.forEach(function(s){h+='<button class="opt'+(s.id===sel?' on':'')+'" data-id="'+s.id+'"><span>'+s.i+'</span>'+s.n+'</button>'});
  $('services').innerHTML=h;
}
function renderHist(){
  var el=$('hist');
  if(!hist.length){el.innerHTML='<div class="empty">Belum ada pesanan.</div>';return}
  el.innerHTML=hist.slice(0,15).map(function(o){
    var cls=o.status==='done'?'b-ok':(o.status==='wait'?'b-wait':'b-no'),lb=o.status==='done'?'Selesai':(o.status==='wait'?'Menunggu':(o.status==='cancel'?'Dibatalkan':'Kedaluwarsa'));
    return '<div class="hist"><div><b>'+svc(o.svc).i+' '+svc(o.svc).n+'</b><br><span class="msg">'+o.number+(o.code?' · '+o.code:'')+'</span></div><span class="badge '+cls+'" style="align-self:center">'+lb+'</span></div>'
  }).join('');
}
function saveHist(){store('nokos_hist',hist.slice(0,30).map(function(o){return {id:o.id,svc:o.svc,number:o.number,code:o.code,status:o.status==='wait'?'expired':o.status}}))}
function setStatus(st){
  order.status=st;
  var b=$('aBadge');
  b.className='badge '+(st==='done'?'b-ok':(st==='wait'?'b-wait':'b-no'));
  b.textContent=st==='done'?'OTP Diterima':(st==='wait'?'Menunggu SMS':(st==='cancel'?'Dibatalkan':'Kedaluwarsa'));
  var fin=st!=='wait';
  $('aWait').classList.toggle('hide',fin);
  $('cancel').classList.toggle('hide',fin);
  $('again').classList.toggle('hide',!fin);
  if(fin){clearInterval(tick);clearTimeout(otpTimer);$('aTimer').textContent='';saveHist()}
  renderHist();
}
function startTimer(){
  clearInterval(tick);
  function upd(){
    if(!order||order.status!=='wait')return;
    var left=Math.max(0,Math.round((order.exp-Date.now())/1000));
    $('aTimer').textContent='Sisa waktu '+fmt(left);
    if(left<=0)setStatus('expired');
  }
  upd();tick=setInterval(upd,1000);
}
function newOrder(){
  var cobj=COUNTRIES[$('country').selectedIndex];
  var btn=$('get');btn.disabled=true;btn.textContent='Memproses…';
  requestNumber(cobj).then(function(r){
    var o={id:Date.now(),svc:sel,number:r.number,pid:r.id,code:'',status:'wait',exp:Date.now()+TTL*1000};
    order=o;hist.unshift(o);
    $('aTitle').textContent=svc(sel).i+' '+svc(sel).n;
    $('aNum').textContent=o.number;
    $('aOtp').classList.add('hide');
    $('active').classList.remove('hide');
    $('orderCard').classList.add('hide');
    setStatus('wait');startTimer();
    $('active').scrollIntoView({behavior:'smooth',block:'start'});
    pollOtp(o).then(function(res){
      if(!res||order!==o||o.status!=='wait')return;
      o.code=res.code;
      $('aCode').textContent=res.code;
      $('aMsg').textContent='Kode verifikasi '+svc(o.svc).n+' Anda: '+res.code+'. Jangan bagikan kepada siapa pun.';
      $('aOtp').classList.remove('hide');
      setStatus('done');
    });
  }).catch(function(e){toast(e&&e.message?e.message:'Gagal mengambil nomor, coba lagi')}).then(function(){btn.disabled=false;btn.textContent='Ambil Nomor'});
}
function reset(){
  $('active').classList.add('hide');$('orderCard').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}

// init
var h='';COUNTRIES.forEach(function(c){h+='<option>'+c.n+' ('+c.p.split(' ')[0]+')</option>'});$('country').innerHTML=h;
var saved=store('nokos_hist');if(Array.isArray(saved))hist=saved.filter(function(o){return o&&svc(o.svc)});
var th=store('nokos_theme');if(th)document.documentElement.setAttribute('data-theme',th);
renderServices();renderHist();
$('services').addEventListener('click',function(e){var b=e.target.closest('.opt');if(!b)return;sel=b.getAttribute('data-id');renderServices()});
$('get').addEventListener('click',newOrder);
$('copyNum').addEventListener('click',function(){if(order)copy(order.number.replace(/\s/g,''))});
$('copyOtp').addEventListener('click',function(){if(order&&order.code)copy(order.code)});
$('cancel').addEventListener('click',function(){if(order&&order.status==='wait'){fetch('/api/order/'+order.pid+'/cancel',{method:'POST'}).catch(function(){});setStatus('cancel')}});
$('again').addEventListener('click',reset);
$('clear').addEventListener('click',function(){if(order&&order.status==='wait'){toast('Selesaikan pesanan aktif dulu');return}hist=[];store('nokos_hist',[]);renderHist()});
$('theme').addEventListener('click',function(){
  var r=document.documentElement,dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;
  var n=dark?'light':'dark';r.setAttribute('data-theme',n);store('nokos_theme',n);
});
})();
</script>
</body>
</html>
